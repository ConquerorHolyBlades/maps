name: Harita verisi topla

on:
  schedule:
    # Türkiye saatiyle 00:07, 06:07, 12:07, 18:07 (UTC 21, 03, 09, 15)
    - cron: "7 3,9,15,21 * * *"
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Önceki veriyi al
        run: |
          if git ls-remote --exit-code --heads origin veri >/dev/null 2>&1; then
            git clone --depth 1 --branch veri "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri
          else
            mkdir veri && git -C veri init -q
          fi
      - name: Verileri topla
        run: python topla.py veri
      - name: Kaydet (tek commit, depo büyümez)
        run: |
          cd veri
          rm -rf .git
          git init -q -b veri
          git config user.name "harita-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Harita verisi $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri:veri
